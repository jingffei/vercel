<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATIA 学习方案介绍</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #333;
        background: #f5f7fa;
        line-height: 1.7;
    }

    /* ===== 导航栏 ===== */
    nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        background: rgba(13, 37, 63, 0.95);
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 6%;
        box-shadow: 0 2px 10px rgba(0,0,0,.2);
    }
    nav .logo { color: #fff; font-size: 20px; font-weight: bold; }
    nav .logo span { color: #4fc3f7; }
    nav ul { display: flex; list-style: none; gap: 28px; }
    nav a { color: #cfe8ff; text-decoration: none; font-size: 15px; transition: .3s; }
    nav a:hover { color: #4fc3f7; }

    /* ===== 首屏 Banner ===== */
    header {
        min-height: 92vh;
        background: linear-gradient(135deg, #0d253f 0%, #1565c0 60%, #0d47a1 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center; color: #fff; padding: 100px 20px 60px;
    }
    header h1 { font-size: 48px; letter-spacing: 4px; margin-bottom: 16px; }
    header h1 span { color: #4fc3f7; }
    header p.sub { font-size: 20px; opacity: .85; max-width: 700px; margin-bottom: 36px; }
    header .btns a {
        display: inline-block; margin: 0 10px; padding: 13px 34px;
        border-radius: 30px; text-decoration: none; font-size: 16px; transition: .3s;
    }
    .btn-primary { background: #4fc3f7; color: #0d253f; font-weight: bold; }
    .btn-primary:hover { background: #81d4fa; transform: translateY(-3px); }
    .btn-outline { border: 2px solid #4fc3f7; color: #4fc3f7; }
    .btn-outline:hover { background: rgba(79,195,247,.15); }
    header .stats { display: flex; gap: 60px; margin-top: 60px; flex-wrap: wrap; justify-content: center; }
    header .stats div { text-align: center; }
    header .stats b { display: block; font-size: 34px; color: #4fc3f7; }

    /* ===== 通用区块 ===== */
    section { padding: 80px 8%; }
    .section-title { text-align: center; margin-bottom: 50px; }
    .section-title h2 { font-size: 32px; color: #0d253f; }
    .section-title p { color: #777; margin-top: 8px; }
    .section-title h2::after {
        content: ""; display: block; width: 60px; height: 4px;
        background: #4fc3f7; margin: 12px auto 0; border-radius: 2px;
    }

    /* ===== CATIA 简介 ===== */
    .intro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
    .intro-card {
        background: #fff; border-radius: 12px; padding: 30px 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,.06); transition: .3s;
        border-top: 4px solid #1565c0;
    }
    .intro-card:hover { transform: translateY(-6px); box-shadow: 0 10px 24px rgba(21,101,192,.15); }
    .intro-card .icon { font-size: 36px; margin-bottom: 14px; }
    .intro-card h3 { color: #0d253f; margin-bottom: 10px; font-size: 18px; }
    .intro-card p { font-size: 14px; color: #666; }

    /* ===== 学习路线 ===== */
    #roadmap { background: #fff; }
    .roadmap-wrap { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .stage {
        flex: 1; min-width: 240px; max-width: 300px;
        background: #f5f9ff; border-radius: 12px; padding: 28px 22px;
        position: relative; border: 1px solid #e3edf7;
    }
    .stage .num {
        width: 44px; height: 44px; border-radius: 50%;
        background: linear-gradient(135deg, #1565c0, #4fc3f7);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: bold; margin-bottom: 16px;
    }
    .stage h3 { color: #0d253f; margin-bottom: 6px; }
    .stage .dur { font-size: 13px; color: #1565c0; background: #e3f2fd; display: inline-block; padding: 2px 12px; border-radius: 12px; margin-bottom: 12px; }
    .stage ul { list-style: none; }
    .stage li { font-size: 14px; color: #555; padding: 4px 0 4px 20px; position: relative; }
    .stage li::before { content: "✔"; position: absolute; left: 0; color: #4fc3f7; font-size: 13px; }

    /* ===== 时间计划表 ===== */
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    th, td { padding: 14px 18px; text-align: left; font-size: 14.5px; }
    thead { background: #0d253f; color: #fff; }
    tbody tr:nth-child(even) { background: #f5f9ff; }
    tbody tr:hover { background: #e3f2fd; }
    td .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
    .tag-green { background: #e8f5e9; color: #2e7d32; }
    .tag-blue  { background: #e3f2fd; color: #1565c0; }
    .tag-orange{ background: #fff3e0; color: #ef6c00; }
    .tag-red   { background: #ffebee; color: #c62828; }

    /* ===== 学习建议 ===== */
    #tips { background: linear-gradient(135deg, #0d253f, #1565c0); color: #fff; }
    #tips .section-title h2 { color: #fff; }
    #tips .section-title p { color: #b0d4f1; }
    .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; }
    .tip-card {
        background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
        border-radius: 12px; padding: 26px 22px; backdrop-filter: blur(4px); transition: .3s;
    }
    .tip-card:hover { background: rgba(255,255,255,.15); transform: translateY(-4px); }
    .tip-card h3 { font-size: 17px; margin-bottom: 10px; color: #4fc3f7; }
    .tip-card p { font-size: 14px; color: #dcecf9; }

    /* ===== 资源推荐 ===== */
    .res-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
    .res-item {
        background: #fff; border-radius: 12px; padding: 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,.06); border-left: 5px solid #4fc3f7;
    }
    .res-item h3 { color: #0d253f; font-size: 17px; margin-bottom: 8px; }
    .res-item p { font-size: 14px; color: #666; }

    /* ===== 页脚 ===== */
    footer { background: #0a1c30; color: #90a4ae; text-align: center; padding: 30px 20px; font-size: 14px; }
    footer a { color: #4fc3f7; text-decoration: none; }

    /* ===== 返回顶部 ===== */
    #backTop {
        position: fixed; right: 30px; bottom: 30px; width: 46px; height: 46px;
        background: #1565c0; color: #fff; border: none; border-radius: 50%;
        font-size: 20px; cursor: pointer; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    #backTop:hover { background: #4fc3f7; }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
        nav ul { display: none; }
        header h1 { font-size: 34px; }
        section { padding: 60px 5%; }
    }
</style>
</head>
<body>

<!-- 导航栏 -->
<nav>
    <div class="logo">CATIA<span>学习方案</span></div>
    <ul>
        <li><a href="#intro">认识CATIA</a></li>
        <li><a href="#roadmap">学习路线</a></li>
        <li><a href="#schedule">学习计划</a></li>
        <li><a href="#tips">学习建议</a></li>
        <li><a href="#resources">资源推荐</a></li>
    </ul>
</nav>

<!-- 首屏 -->
<header>
    <h1>CATIA 系统学习方案</h1>
    <p class="sub">从零基础到工程实战 —— 掌握达索 CATIA 三维设计核心技能，助力航空航天、汽车、机械等行业职业发展</p>
    <div class="btns">
        <a class="btn-primary" href="#roadmap">查看学习路线</a>
        <a class="btn-outline" href="#schedule">下载计划安排</a>
    </div>
    <div class="stats">
        <div><b>4</b>学习阶段</div>
        <div><b>16 周</b>完整周期</div>
        <div><b>6+</b>核心模块</div>
        <div><b>3 个</b>实战项目</div>
    </div>
</header>
